steps:
  # =========================================================
  # 1. DOWNLOAD THE REAL AI FILES FROM GIT LFS
  # =========================================================
  - name: 'ubuntu:24.04'
    id: 'Download AI models'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        echo "Installing Git and Git LFS..."
        apt-get update
        apt-get install -y git git-lfs

        git lfs install

        echo "Downloading AI files from Git LFS..."

        git lfs fetch \
          --include="Django/trainedai/**" \
          origin "$COMMIT_SHA"

        git lfs checkout

        echo ""
        echo "========================================="
        echo "Git LFS files"
        echo "========================================="

        git lfs ls-files

        echo ""
        echo "========================================="
        echo "AI directory"
        echo "========================================="

        ls -lh Django/trainedai/dinov2-base
        ls -lh Django/trainedai/dinov2-base/best_model || true

        echo ""
        echo "Checking for Git LFS pointer files..."

        if head -c 200 Django/trainedai/dinov2-base/dinov2_banana_disease.pth | grep -q "git-lfs.github.com/spec"; then
          echo "ERROR: dinov2_banana_disease.pth is still a Git LFS pointer."
          exit 1
        fi

        if head -c 200 Django/trainedai/dinov2-base/initial_references.pt | grep -q "git-lfs.github.com/spec"; then
          echo "ERROR: initial_references.pt is still a Git LFS pointer."
          exit 1
        fi

        if head -c 200 Django/trainedai/dinov2-base/disease_references.pt | grep -q "git-lfs.github.com/spec"; then
          echo "ERROR: disease_references.pt is still a Git LFS pointer."
          exit 1
        fi

        if [ -f Django/trainedai/dinov2-base/best_model/model.safetensors ]; then
          if head -c 200 Django/trainedai/dinov2-base/best_model/model.safetensors | grep -q "git-lfs.github.com/spec"; then
            echo "ERROR: model.safetensors is still a Git LFS pointer."
            exit 1
          fi
        fi

        echo ""
        echo "Checking main AI model size..."

        MODEL_SIZE=$(stat -c%s Django/trainedai/dinov2-base/dinov2_banana_disease.pth)

        echo "dinov2_banana_disease.pth size: $$MODEL_SIZE bytes"

        if [ "$$MODEL_SIZE" -lt 100000000 ]; then
          echo "ERROR: AI model is unexpectedly small."
          exit 1
        fi

        echo ""
        echo "SUCCESS: Real AI model files have been downloaded."


  # =========================================================
  # 2. BUILD THE DJANGO DOCKER IMAGE
  # =========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Docker image'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'
      - '-f'
      - 'Django/Dockerfile'
      - 'Django'


  # =========================================================
  # 3. VERIFY THE AI IS ACTUALLY INSIDE THE DOCKER IMAGE
  # =========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Verify AI inside image'
    entrypoint: 'docker'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'sh'
      - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'
      - '-c'
      - |
        set -e

        echo ""
        echo "========================================="
        echo "AI files inside Docker image"
        echo "========================================="

        ls -lh /app/trainedai/dinov2-base
        ls -lh /app/trainedai/dinov2-base/best_model || true

        echo ""
        echo "Checking main .pth file..."

        if head -c 200 /app/trainedai/dinov2-base/dinov2_banana_disease.pth | grep -q "git-lfs.github.com/spec"; then
          echo "ERROR: Docker image contains an LFS pointer instead of the real .pth model."
          exit 1
        fi

        echo "Checking initial reference file..."

        if head -c 200 /app/trainedai/dinov2-base/initial_references.pt | grep -q "git-lfs.github.com/spec"; then
          echo "ERROR: Docker image contains an LFS pointer for initial_references.pt."
          exit 1
        fi

        echo "Checking disease reference file..."

        if head -c 200 /app/trainedai/dinov2-base/disease_references.pt | grep -q "git-lfs.github.com/spec"; then
          echo "ERROR: Docker image contains an LFS pointer for disease_references.pt."
          exit 1
        fi

        MODEL_SIZE=$(stat -c%s /app/trainedai/dinov2-base/dinov2_banana_disease.pth)

        echo "Model inside Docker image: $$MODEL_SIZE bytes"

        if [ "$$MODEL_SIZE" -lt 100000000 ]; then
          echo "ERROR: AI model inside Docker image is too small."
          exit 1
        fi

        echo ""
        echo "SUCCESS: AI model verification inside Docker image PASSED."


  # =========================================================
  # 4. PUSH THE VERIFIED IMAGE
  # =========================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Docker image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'


  # =========================================================
  # 5. DEPLOY THE EXACT NEW IMAGE TO CLOUD RUN
  # =========================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'b-leaf-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--quiet'


# =========================================================
# CLOUD BUILD SETTINGS
# =========================================================
options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'