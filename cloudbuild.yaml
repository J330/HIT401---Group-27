steps:
  - name: 'ubuntu:24.04'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        apt-get update
        apt-get install -y git git-lfs

        git lfs install

        git lfs fetch \
          --include="Django/trainedai/**" \
          origin "$COMMIT_SHA"

        git lfs checkout

        echo "Checking AI files..."

        ls -lh Django/trainedai/dinov2-base
        ls -lh Django/trainedai/dinov2-base/best_model

        # These must NOT be Git LFS pointer files
        if grep -q "git-lfs.github.com/spec" Django/trainedai/dinov2-base/dinov2_banana_disease.pth; then
          echo "ERROR: dinov2_banana_disease.pth is still an LFS pointer"
          exit 1
        fi

        if grep -q "git-lfs.github.com/spec" Django/trainedai/dinov2-base/initial_references.pt; then
          echo "ERROR: initial_references.pt is still an LFS pointer"
          exit 1
        fi

        if grep -q "git-lfs.github.com/spec" Django/trainedai/dinov2-base/disease_references.pt; then
          echo "ERROR: disease_references.pt is still an LFS pointer"
          exit 1
        fi

        # The main checkpoint should be hundreds of MB
        test "$(stat -c%s Django/trainedai/dinov2-base/dinov2_banana_disease.pth)" -gt 100000000

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'
      - '-f'
      - 'Django/Dockerfile'
      - 'Django'

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'docker'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'sh'
      - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'
      - '-c'
      - |
        echo "Checking AI files inside final Docker image"

        ls -lh /app/trainedai/dinov2-base

        if grep -q "git-lfs.github.com/spec" /app/trainedai/dinov2-base/dinov2_banana_disease.pth; then
          echo "ERROR: Docker image contains LFS pointer instead of AI model"
          exit 1
        fi

        test "$(stat -c%s /app/trainedai/dinov2-base/dinov2_banana_disease.pth)" -gt 100000000

images:
  - 'gcr.io/$PROJECT_ID/github.com/j330/hit401---group-27:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY