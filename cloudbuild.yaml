# IMPORTANT: This GitHub-triggered workflow requires *real* trained model files.
# It downloads them from a GCS bucket when _MODEL_BUCKET is configured.
# The older Dockerfile-style source deploy can start the website without models,
# but prediction still cannot work until the checkpoints exist.
# GitHub-triggered builds initially receive Git LFS pointer files.
# If _MODEL_BUCKET is set, restore the two checkpoints from Cloud Storage.
# Otherwise attempt to fetch the real bytes from public GitHub LFS at this commit.
# If GitHub LFS access/quota fails, set _MODEL_BUCKET to a Cloud Storage bucket.
# Create an Artifact Registry Docker repository before using this pipeline.
substitutions:
  _SERVICE_NAME: banana-leaf-detector
  _REGION: australia-southeast1
  _REPOSITORY: cloud-run-images
  _ACTIVE_MODEL: convnextv2
  _DJANGO_SECRET: django-secret
  _MODEL_BUCKET: ''
  _GIT_LFS_REPO: 'https://github.com/J330/HIT401---Group-27.git'

steps:
  # The Cloud SDK stable image has gcloud, but may not include python3.
  # Fetch model weights first, then verify with a separate Python image.
  - id: 'Fetch model checkpoints'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [[ -n "${_MODEL_BUCKET}" ]]; then
          mkdir -p ml/models
          case "${_ACTIVE_MODEL}" in
            convnextv2) FILE=convnextv2base.pt ;;
            efficientnetv2s) FILE=effnetv2s.pt ;;
            swin) FILE=swinbase.pt ;;
            vit) FILE=vitbase.pt ;;
            *) echo 'Invalid _ACTIVE_MODEL'; exit 1 ;;
          esac
          gcloud storage cp "gs://${_MODEL_BUCKET}/gate_centroids.pt" ml/models/gate_centroids.pt
          gcloud storage cp "gs://${_MODEL_BUCKET}/$$FILE" "ml/models/$$FILE"
        fi

  # Runs only if _MODEL_BUCKET is empty and the worktree still has pointers.
  # Uses the exact fetched commit so a newer GitHub push cannot change weights.
  - id: 'Resolve GitHub LFS checkpoints'
    name: 'ubuntu:24.04'
    entrypoint: 'bash'
    args: ['cloudrun/fetch_git_lfs.sh', '${_MODEL_BUCKET}', '${_ACTIVE_MODEL}', '$COMMIT_SHA', '${_GIT_LFS_REPO}']

  - id: 'Verify model checkpoints'
    name: 'python:3.11-slim'
    entrypoint: 'python3'
    args: ['cloudrun/check_models.py', '--model', '${_ACTIVE_MODEL}']

  - id: 'Build image'
    name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'ACTIVE_MODEL=${_ACTIVE_MODEL}', '-f', 'Dockerfile',
           '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID', '.']
  - id: 'Push image'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID']
  - id: 'Deploy to Cloud Run'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    entrypoint: 'gcloud'
    args: ['run', 'deploy', '${_SERVICE_NAME}',
           '--image', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID',
           '--region', '${_REGION}', '--platform', 'managed',
           '--memory', '8Gi', '--cpu', '2', '--concurrency', '1',
           '--timeout', '900', '--min-instances', '0', '--max-instances', '1',
           '--set-env-vars', 'ACTIVE_MODEL=${_ACTIVE_MODEL},DEBUG=False,SAVE_PREDICTIONS=False',
           '--set-secrets', 'SECRET_KEY=${_DJANGO_SECRET}:latest',
           '--allow-unauthenticated', '--quiet']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '3600s'
