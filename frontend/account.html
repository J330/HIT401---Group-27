<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Black Sigatoka Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Account</h1><p>Log in to view your private scan history.</p></header>
  <main>
    <label>Username <input id="username" type="text" value="demo" autocomplete="username"></label>
    <label>Password <input id="password" type="password" value="demo1234" autocomplete="current-password"></label>
    <button id="loginBtn" type="button">Log in</button>
    <p id="accountStatus"></p>
  </main>
  <script src="js/account.js"></script>
</body>
</html>
